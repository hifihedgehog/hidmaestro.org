<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Input latency, lower is better. HIDMaestro 0.035 ms. VIIPER localhost 0.168 ms. VIIPER over wired LAN 1 to 5 ms. VIIPER over Wi-Fi 10 to 50 ms.">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c50"/>
      <stop offset="1" stop-color="#d9531c"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="818" height="298" rx="12" fill="#12171f" stroke="#212a36"/>

  <!-- HIDMaestro -->
  <text x="200" y="61" text-anchor="end" fill="#93a0b1" font-size="14">HIDMaestro</text>
  <rect x="210" y="40" width="480" height="32" rx="4" fill="#0a0d12"/>
  <rect x="210" y="40" width="5" height="32" rx="2" fill="url(#ember)"/>
  <text x="226" y="61" fill="#ff7d3d" font-size="14" font-weight="700">0.035 ms</text>

  <!-- VIIPER localhost -->
  <text x="200" y="121" text-anchor="end" fill="#93a0b1" font-size="14">VIIPER (localhost)</text>
  <rect x="210" y="100" width="480" height="32" rx="4" fill="#0a0d12"/>
  <rect x="210" y="100" width="9" height="32" rx="2" fill="#3d4a5c"/>
  <text x="230" y="121" fill="#aeb9c8" font-size="14" font-weight="700">0.168 ms</text>

  <!-- VIIPER + wired LAN -->
  <text x="200" y="181" text-anchor="end" fill="#93a0b1" font-size="14">VIIPER + wired LAN</text>
  <rect x="210" y="160" width="480" height="32" rx="4" fill="#0a0d12"/>
  <rect x="210" y="160" width="55" height="32" rx="4" fill="#3d4a5c"/>
  <text x="275" y="181" fill="#aeb9c8" font-size="14" font-weight="700">1&#8211;5 ms</text>

  <!-- VIIPER + Wi-Fi -->
  <text x="200" y="241" text-anchor="end" fill="#93a0b1" font-size="14">VIIPER + Wi-Fi</text>
  <rect x="210" y="220" width="480" height="32" rx="4" fill="#0a0d12"/>
  <rect x="210" y="220" width="480" height="32" rx="4" fill="#3d4a5c"/>
  <text x="682" y="241" text-anchor="end" fill="#f5f7fb" font-size="14" font-weight="700">10&#8211;50 ms</text>

  <!-- caption -->
  <text x="210" y="284" fill="#616d7c" font-size="12">Lower is better. Linear scale, milliseconds. Network bars use the optimistic end of typical LAN latency.</text>
</svg>
