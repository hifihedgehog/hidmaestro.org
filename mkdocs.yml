site_name: HIDMaestro Documentation
site_url: https://hidmaestro.org/docs/
site_description: >-
  HIDMaestro creates virtual game controllers that look like real hardware
  to Windows. These docs cover everything from the SDK quickstart to wire
  protocols.
repo_url: https://github.com/hifihedgehog/HIDMaestro
repo_name: hifihedgehog/HIDMaestro
edit_uri: ""

docs_dir: wiki
site_dir: docs
# The theme overrides live in the docs folder, so keep the templates
# themselves out of the published site.
exclude_docs: |
  /overrides/

theme:
  name: material
  custom_dir: wiki/overrides
  # The header follows the scheme, so overrides/partials/logo.html shows
  # the dark mark on the light pane and the light mark on the dark one.
  logo: assets/logo.png
  favicon: assets/icon.png
  # No web font: the docs use the system's Segoe UI Variable, as PadForge
  # and the landing page do (stylesheets/extra.css). Material's own Google
  # Fonts loader stays off, and wiki/overrides/main.html loads nothing.
  font: false
  # Both schemes take PadForge's app brushes, set in stylesheets/extra.css.
  palette:
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start:
      - start/index.md
      - Installation: start/installation.md
      - Removing HIDMaestro: start/removing-hidmaestro.md
      - Platform support: start/platform-support.md
      - Quickstart: start/quickstart.md
      - Glossary: start/glossary.md
      - Moving from 1.x: start/migration.md
  - SDK:
      - sdk/index.md
      - SDK Reference: sdk/sdk-reference.md
      - VR Controllers: sdk/vr-controllers.md
      - HID Descriptor Builder: sdk/hid-descriptor-builder.md
      - Force Feedback: sdk/force-feedback.md
      - Output Passthrough: sdk/output-passthrough.md
      - Composite USB Personas: sdk/usb-audio-composite.md
      - DualShock 3 and Pressure: sdk/dualshock-3.md
      - Switch 2 Pro with Motion: sdk/switch2-pro.md
      - Keyboards and Mice: sdk/keyboards-and-mice.md
      - Touchscreens, Touchpads and Pens: sdk/touch-and-pen.md
      - Wii U GameCube Adapter: sdk/gamecube-adapter.md
      - Programs Side by Side: sdk/programs-side-by-side.md
      - OEM Name Override: sdk/oem-name-override.md
  - Profiles:
      - profiles/index.md
      - Profile System: profiles/profile-system.md
      - Custom Profiles: profiles/custom-profiles.md
      - Profile Extractor: profiles/profile-extractor.md
      - Contributing Profiles: profiles/contributing-profiles.md
  - Troubleshooting: troubleshooting.md
  - Technical Reference:
      - reference/index.md
      - Architecture Overview: reference/architecture-overview.md
      - UMDF2 Driver Internals: reference/umdf2-driver-internals.md
      - XUSB Companion: reference/xusb-companion.md
      - SwDevice and PnP: reference/swdevice-and-pnp.md
      - Shared Memory Protocol: reference/shared-memory-protocol.md
      - Cross-API Coverage: reference/cross-api-coverage.md
      - Multi-Controller: reference/multi-controller.md
      - Lifecycle and Teardown: reference/lifecycle-and-teardown.md
      - Driver Install and Signing: reference/driver-install-and-signing.md
      - Build and Release: reference/build-and-release.md
      - Testing and Verification: reference/testing-and-verification.md
      - References: reference/references.md
