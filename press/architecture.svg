<g fill="#929fb0" font-size="21"><text x="125" y="447">Input state</text><text x="125" y="483">Output events</text><text x="670" y="447">C# SDK</text><text x="670" y="483">Virtual-device drivers</text><text x="1215" y="447">Virtual controllers</text><text x="1215" y="483">Game input APIs</text></g>
<g fill="#6fc3d6" font-size="15" font-family="Consolas, monospace"><text x="125" y="543">SubmitState</text><text x="670" y="543">HID / XUSB / USB</text><text x="1215" y="543">Identity + reports</text></g>
