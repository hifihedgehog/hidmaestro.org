<text x="90" y="162" fill="#f7f9fc" font-size="46" font-weight="600" letter-spacing="-1.5">Virtual controller architecture</text>
<text x="90" y="206" fill="#929fb0" font-size="21">Input moves toward the game. Output returns to the application.</text>
<g fill="#12171f" stroke="#212a36" stroke-width="2"><rect x="90" y="340" width="330" height="240" rx="8"/><rect x="635" y="340" width="330" height="240" rx="8"/><rect x="1180" y="340" width="330" height="240" rx="8"/></g>
