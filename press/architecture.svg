<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title description">
<title id="title">HIDMaestro architecture overview</title>
<desc id="description">An application's input passes through the HIDMaestro SDK and drivers to virtual controllers in Windows. JSON profiles configure device identity. Output events return to the application. Input API support depends on the selected profile. Composite USB profiles also use the usbip-win2 transport.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#6fc3d6" stroke-width="1.4"/></marker></defs>
