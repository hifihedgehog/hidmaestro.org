<title id="title">HIDMaestro performance, release over release</title>
<desc id="description">Process start to the first controller, DualShock 4: 76% of 1.12.0&#x27;s time at 2.0.2. CreateController, Xbox 360: 43% of 1.12.0&#x27;s time at 2.0.2. Dispose, DualSense over USB/IP: 0.8% of 1.12.0&#x27;s time at 2.0.2. SubmitState to a game&#x27;s ReadFile, DualShock 4: 77% of 1.12.0&#x27;s time at 2.0.2. SubmitState to XInputGetState, Xbox 360: 98% of 1.12.0&#x27;s time at 2.0.2. SubmitState, Xbox 360: 85% of 1.12.0&#x27;s time at 2.0.2.</desc>
